<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge the Blocks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🎮 Dodge the Blocks</h1>

        <div class="score-board">
    Score: <span id="score">0</span>
</div>

<div class="score-board">
    High Score: <span id="highScore">0</span>
</div>
    Best: <span id="bestScore">0</span>
</div>

        <div id="game-area">
            <div id="player"></div>
        </div>
<div class="mobile-controls">
    <button id="leftBtn" type="button">⬅️ Left</button>
    <button id="stopBtn" type="button">⏹ Stop</button>
    <button id="rightBtn" type="button">Right ➡️</button>
</div>
        <button id="startBtn">Start Game</button>

        <p id="message">Press Start to play!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
